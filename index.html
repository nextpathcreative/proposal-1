<!DOCTYPE html>
<!--
  index.html — ROOT of the proposals host.
  ---------------------------------------------------------------------
  This host serves one folder per prospect, e.g.:
      /pdx-heating-cooling-20260814/

  The root itself is NOT a proposal. It used to serve the Rose City Plumbing
  build; that was replaced so anyone who trims a proposal URL back to the
  domain doesn't land on a proposal for a business they aren't.
  (The old root build is preserved at _rose-city-v1.html.bak and in git.)

  Redirect is belt-and-braces: meta refresh fires without JS, the script
  fires immediately, and the link is the fallback if both are blocked.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="refresh" content="0; url=https://nextpathcreative.io/" />
  <title>NextPath Creative</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0d0d0f; color: #f7f7f7;
    }
    a { color: #7dd3d8; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://nextpathcreative.io/">nextpathcreative.io</a>&hellip;</p>
  <script>window.location.replace("https://nextpathcreative.io/");</script>
</body>
</html>
